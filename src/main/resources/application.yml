server:
  port: ${PORT}

spring:
  application:
    name: ms-foodcourt
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

adapters:
  db:
    host: ${DB_HOST}
    port: ${DB_PORT}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    database: ${DB_NAME}

logging:
  level:
    com:
      foodcourt: ${LOG_LEVEL:-INFO}
    org:
      hibernate:
        orm:
          connections:
            pooling: ERROR

management:
  endpoints:
    web:
      exposure:
        include: health

external-api:
   auth-service:
     url: ${AUTH_API_URL}

jwt:
  secret: ${JWT_SECRET}